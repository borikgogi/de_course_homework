# Завдання 3 і 4 — стек із двох сервісів. Специфікація: ../SPEC.md → «docker-compose».
#
# Потрібні два сервіси:
#
#   postgres  — образ postgres:16-alpine; credentials зі змінних оточення
#               (POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB); named volume під
#               дані БД; HEALTHCHECK через pg_isready.
#
#   ingestor  — будується з вашого Dockerfile (build: .); підключається до Postgres
#               ПО ІМЕНІ СЕРВІСУ (PGHOST: postgres) — це Docker-networking; стартує
#               лише ПІСЛЯ того, як postgres став healthy (depends_on + condition:
#               service_healthy); named volume під кеш завантаження (/cache).
#
# Змінні беруться з .env (скопіюйте .env.example → .env).
# Перевірте: docker compose up --build  (ingestor завершиться, дані будуть у Postgres).

# TODO: опишіть services та volumes тут.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghpass}
      POSTGRES_DB: ${POSTGRES_DB:-gharchive}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-gh} -d $${POSTGRES_DB:-gharchive}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ingestor:
    build: .
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-gh}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ghpass}
      PGDATABASE: ${POSTGRES_DB:-gharchive}
      ARCHIVE_URL: ${ARCHIVE_URL}
    volumes:
      - cache_data:/cache
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  cache_data:
